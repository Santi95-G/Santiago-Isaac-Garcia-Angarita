<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LevelUp - Tienda de Videojuegos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="overlay" id="overlay" onclick="closeCart()"></div>

        <div class="cart-panel" id="cartPanel">
            <div class="cart-hdr">
                <h3>Carrito</h3>
                <button class="close-btn" onclick="closeCart()"></button>
            </div>
            <div class="cart-items" id="cartItems">
                <p class="empty">Tu carrito está vacío</p>
            </div>
            <div class="cart-footer">
                <div class="total-row">
                    <span class="total-label">Total</span>
                    <span class="total-amount" id="totalAmount">$0</span>
                </div>
                <button class="btn-checkout">Finalizar compra</button>
            </div>
        </div>

        <div class="nav">
            <div class="log">Level<span>Up</span></div>
            <div class="nav-links">
                <a onclick="scrollTo(0,0)">Inicio</a>
                <a onclick="document.getElementById('catalogo').scrollIntoView({behavior:'smooth´})">Catalogo</a>
            </div>
            <button class="cart-btn" onclick="openCart()">
                Carrito <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>

        <div class="hero-setion">
            <div class="hero-text">
                <h1>WOW GAMES,<br><span class="green">WOW DEALS</span></h1>
                <P>Descubre los mejores títulos al mejor precio</P>
                <button class="btn-hero" onclick="document.getElementById('catalogo').scrollIntoView({behavior:'smooth'})">VER CATÁLOGO</button>
            </div>
        </div>

        <div class="section" id="catalogo">
            <div class ="section-hdr"><h2>CATÁLOGO DE JUEGOS</h2></div>
            <div class="grid" id="grid"></div>
        </div>
    </div>

    <script src="app.js"></script>
    
</body>
</html>
